<script>
(function(){
  // ------------- 璇玑·星尘华尔兹 - 完全原创轨道节奏游戏 -------------
  // 核心: 固定星(顶端正上), 旋转星绕轨公转。重合时按键判定。
  // 心理学亮点: 动态心流倍率(连击提升速度&得分倍率)、随机星芒奖励、连击心流时刻、华丽粒子、完美/良好/失契统计
  // 完全合规: 无任何版权素材, Web Audio合成音效, 原创代码
  
  // ----- DOM 元素 -----
  const canvas = document.getElementById('stellarCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreValue');
  const comboSpan = document.getElementById('comboValue');
  const maxComboSpan = document.getElementById('maxComboValue');
  const flowMultSpan = document.getElementById('flowMultiplier');
  const perfectSpan = document.getElementById('perfectCount');
  const goodSpan = document.getElementById('goodCount');
  const missSpan = document.getElementById('missCount');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmDisplay = document.getElementById('bpmDisplay');
  const startBtn = document.getElementById('startGameBtn');
  const feedbackDiv = document.getElementById('feedbackMessage');
  
  // ----- 游戏状态 -----
  let gameActive = false;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let perfectTotal = 0;
  let goodTotal = 0;
  let missTotal = 0;
  let totalAttempts = 0;   // 总判定次数(用于统计)
  
  // 动态难度/心流倍率 (影响得分和旋转速度)
  let flowMultiplier = 1.0;        // 得分倍率, 同时影响转速系数
  let baseAngularSpeed = 0;        // 弧度/秒 (由BPM决定)
  let currentAngularSpeed = 0;     // 实际转速 = baseAngularSpeed * flowMultiplier
  let lastTimestamp = 0;
  let animFrame = null;
  
  // 几何参数
  let centerX = 300, centerY = 300;
  let orbitRadius = 240;
  const fixedAngle = -Math.PI / 2;   // 固定星在顶部
  let rotAngle = 0;                  // 旋转星当前角度
  
  // 判定窗口 (弧度)
  const PERFECT_RAD = 0.07;          // ~4度
  const GOOD_RAD = 0.16;             // ~9度
  let canHitThisCycle = true;        // 每个重合周期仅一次判定
  
  // 随机星芒奖励 (每圈独立概率)
  let starGlowActive = false;        // 当前圈是否为星芒圈
  let starGlowTimer = 0;             // 用于视觉闪烁
  
  // 心流时刻 (连击达到阈值触发额外奖励)
  let flowTriggered = false;
  
  // 粒子系统
  let particles = [];
  
  // 音效
  let audioCtx = null;
  let soundEnabled = false;
  
  // 视觉特效
  let hitFlash = 0;
  let perfectFlash = 0;
  let missFlash = 0;
  let multiplierFlash = 0;
  
  // 反馈计时
  let feedbackTimeout = null;
  
  // ---------- 辅助函数 ----------
  function setFeedbackMessage(msg, isGood = true) {
    if (feedbackTimeout) clearTimeout(feedbackTimeout);
    feedbackDiv.innerHTML = msg;
    feedbackDiv.style.background = isGood ? '#fff3e4' : '#ffded0';
    feedbackDiv.style.color = isGood ? '#7a5a44' : '#bc4e32';
    feedbackTimeout = setTimeout(() => {
      if (gameActive) feedbackDiv.innerHTML = '✨ 当双星相拥，指尖轻触 ✨';
      else feedbackDiv.innerHTML = '🌙 点击「启舞」开始星尘华尔兹 🌙';
      feedbackDiv.style.background = '#fff8ed';
      feedbackDiv.style.color = '#7a5a44';
    }, 900);
  }
  
  // 合成命中音效 (完美更清脆)
  function playHitSound(perfect = false, isBonus = false) {
    if (!soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      let freq = perfect ? 1360 : 880;
      if (isBonus) freq = 1560;
      osc.frequency.value = freq;
      gain.gain.value = 0.22;
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.16);
    } catch(e) {}
  }
  
  function playMissSound() {
    if (!soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 360;
      gain.gain.value = 0.12;
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.2);
    } catch(e) {}
  }
  
  // 更新UI显示
  function updateStatsUI() {
    scoreSpan.innerText = Math.floor(score);
    comboSpan.innerText = combo;
    if (combo > maxCombo) {
      maxCombo = combo;
      maxComboSpan.innerText = maxCombo;
    }
    flowMultSpan.innerText = flowMultiplier.toFixed(2);
    perfectSpan.innerText = perfectTotal;
    goodSpan.innerText = goodTotal;
    missSpan.innerText = missTotal;
  }
  
  // 重置统计 (保留BPM)
  function fullReset() {
    score = 0;
    combo = 0;
    perfectTotal = 0;
    goodTotal = 0;
    missTotal = 0;
    totalAttempts = 0;
    flowMultiplier = 1.0;
    rotAngle = 0;
    canHitThisCycle = true;
    starGlowActive = false;
    particles = [];
    hitFlash = 0;
    perfectFlash = 0;
    missFlash = 0;
    multiplierFlash = 0;
    updateStatsUI();
    setFeedbackMessage("✨ 星轨重置，心弦待奏 ✨", true);
  }
  
  // 更新转速 (基于基准BPM和心流倍率)
  function updateAngularSpeed() {
    let bpm = parseInt(bpmSlider.value);
    bpmDisplay.innerText = bpm;
    // 基准转速: 每分钟旋转圈数 = bpm / 30  (使速度适宜: 100BPM ≈ 3.33圈/分钟 → 0.349 rad/s)
    // 为了更具挑战: 使用公式: 转速(rad/s) = 2π * (bpm / 180)
    baseAngularSpeed = (2 * Math.PI) * (bpm / 180);
    currentAngularSpeed = baseAngularSpeed * flowMultiplier;
  }
  
  // 动态难度调节: 根据连击更新心流倍率 (连击越高倍率越高, 上限2.2)
  function updateFlowMultiplierByCombo() {
    let newMult = 1.0;
    if (combo >= 50) newMult = 2.2;
    else if (combo >= 30) newMult = 1.9;
    else if (combo >= 20) newMult = 1.6;
    else if (combo >= 10) newMult = 1.3;
    else newMult = 1.0;
    if (newMult !== flowMultiplier) {
      flowMultiplier = newMult;
      multiplierFlash = 0.6;
      setFeedbackMessage(`🌀 心流倍率 ${flowMultiplier.toFixed(2)}x · 星轨加速 🌀`, true);
      updateAngularSpeed();
    }
  }
  
  // 连击达到阈值触发额外奖励 (心流时刻)
  function checkFlowMoment() {
    if (combo >= 15 && combo % 15 === 0 && !flowTriggered) {
      flowTriggered = true;
      // 奖励额外分数
      let bonus = 500 * flowMultiplier;
      score += bonus;
      setFeedbackMessage(`✨ 心流时刻 · 星尘共鸣 +${Math.floor(bonus)} ✨`, true);
      // 全屏闪烁效果
      perfectFlash = 0.8;
      // 额外粒子爆发
      for (let i = 0; i < 30; i++) addParticle(centerX, centerY, true);
      updateStatsUI();
      setTimeout(() => { flowTriggered = false; }, 500);
    }
  }
  
  // 生成随机星芒 (每圈概率)
  function rollStarGlow() {
    if (!gameActive) return;
    // 15%几率星芒圈, 且连击大于5时更易出现惊喜
    let prob = 0.12 + (combo / 300);
    if (Math.random() < prob) {
      starGlowActive = true;
      starGlowTimer = 0.8;
      setFeedbackMessage("🌟 星芒之约 · 双倍星尘 🌟", true);
    } else {
      starGlowActive = false;
    }
  }
  
  // ---------- 判定逻辑 ----------
  function handlePlayerAction() {
    if (!gameActive) {
      setFeedbackMessage("💫 请先点击「启舞」开启星轨 💫", false);
      return;
    }
    let angleDiff = getAngleDifference(rotAngle, fixedAngle);
    totalAttempts++;
    let isHit = false;
    let perfect = false;
    let points = 0;
    let isBonus = starGlowActive;
    
    if (canHitThisCycle && angleDiff <= GOOD_RAD) {
      isHit = true;
      if (angleDiff <= PERFECT_RAD) {
        perfect = true;
        points = Math.floor(120 * flowMultiplier);
        if (isBonus) points = Math.floor(points * 2);
        score += points;
        combo++;
        perfectTotal++;
        setFeedbackMessage(`💖 完美契合 ${isBonus ? '✨星芒双倍✨' : ''} +${points}`, true);
        playHitSound(true, isBonus);
        perfectFlash = 0.5;
        // 增加华丽粒子
        for (let i = 0; i < 12; i++) addParticleFromAngle(rotAngle, true);
      } else {
        points = Math.floor(60 * flowMultiplier);
        if (isBonus) points = Math.floor(points * 1.5);
        score += points;
        combo++;
        goodTotal++;
        setFeedbackMessage(`🌙 良好相映 +${points}`, true);
        playHitSound(false, isBonus);
        hitFlash = 0.4;
        for (let i = 0; i < 6; i++) addParticleFromAngle(rotAngle, false);
      }
      canHitThisCycle = false;
      // 星芒圈被命中后清除星芒效果
      if (starGlowActive) starGlowActive = false;
      // 动态倍率更新
      updateFlowMultiplierByCombo();
      updateAngularSpeed();
      checkFlowMoment();
      updateStatsUI();
    } else {
      // Miss
      combo = 0;
      missTotal++;
      flowMultiplier = 1.0;
      updateAngularSpeed();
      setFeedbackMessage("❄️ 失契 · 星轨微寒", false);
      playMissSound();
      missFlash = 0.6;
      updateStatsUI();
      // 重置周期标记以防卡判定
      canHitThisCycle = true;
      // 星芒消失
      starGlowActive = false;
    }
  }
  
  function getAngleDifference(a, b) {
    let diff = Math.abs(a - b) % (2 * Math.PI);
    return Math.min(diff, 2 * Math.PI - diff);
  }
  
  // 旋转星更新 (每帧)
  function updateRotation(deltaSec) {
    if (!gameActive) return;
    let prevAngle = rotAngle;
    rotAngle = (rotAngle + currentAngularSpeed * deltaSec) % (2 * Math.PI);
    let angleDiff = getAngleDifference(rotAngle, fixedAngle);
    let prevDiff = getAngleDifference(prevAngle, fixedAngle);
    // 离开判定区重置可命中标记
    if (prevDiff < GOOD_RAD && angleDiff >= GOOD_RAD) {
      canHitThisCycle = true;
      // 当离开判定区时，为新一圈随机星芒奖励
      rollStarGlow();
    }
    // 星芒计时衰减
    if (starGlowTimer > 0) starGlowTimer -= deltaSec;
    if (starGlowTimer <= 0) starGlowActive = false;
  }
  
  // 粒子系统
  function addParticle(x, y, perfect) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120 - 40,
      life: 0.8, color: perfect ? '#ffc285' : '#f7e0a8', size: Math.random() * 4 + 2
    });
  }
  function addParticleFromAngle(angle, perfect) {
    let x = centerX + Math.cos(angle) * orbitRadius;
    let y = centerY + Math.sin(angle) * orbitRadius;
    for (let i = 0; i < (perfect ? 8 : 4); i++) addParticle(x, y, perfect);
  }
  function updateParticles(delta) {
    for (let i=0; i<particles.length; i++) {
      particles[i].x += particles[i].vx * delta;
      particles[i].y += particles[i].vy * delta;
      particles[i].life -= delta * 1.5;
      if (particles[i].life <= 0) particles.splice(i,1), i--;
    }
  }
  
  // ---------- 华丽绘图 ----------
  function drawBackground() {
    let grad = ctx.createLinearGradient(0,0,600,600);
    grad.addColorStop(0,'#100c24');
    grad.addColorStop(1,'#231e3f');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,600,600);
    for(let i=0;i<180;i++) {
      ctx.fillStyle = `rgba(255,230,180,${Math.random()*0.3})`;
      ctx.beginPath();
      ctx.arc((i*131)%600, (i*253)%600, 1.2,0,Math.PI*2);
      ctx.fill();
    }
  }
  
  function drawOrbit() {
    ctx.beginPath();
    ctx.arc(centerX, centerY, orbitRadius, 0, 2*Math.PI);
    ctx.strokeStyle = '#cfbc97';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6,12]);
    ctx.stroke();
    ctx.setLineDash([]);
    for(let ang=0; ang<2*Math.PI; ang+=Math.PI/8) {
      let x = centerX + Math.cos(ang)*orbitRadius;
      let y = centerY + Math.sin(ang)*orbitRadius;
      ctx.beginPath();
      ctx.arc(x,y,2.5,0,2*Math.PI);
      ctx.fillStyle = '#efd6a8';
      ctx.fill();
    }
  }
  
  function drawFixedStar() {
    let x = centerX + Math.cos(fixedAngle)*orbitRadius;
    let y = centerY + Math.sin(fixedAngle)*orbitRadius;
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#f3a469';
    ctx.beginPath();
    ctx.arc(x,y,24,0,2*Math.PI);
    ctx.fillStyle = '#d68b5c';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x,y,16,0,2*Math.PI);
    ctx.fillStyle = '#ffcf96';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x-3,y-3,5,0,2*Math.PI);
    ctx.fillStyle = '#fff0cf';
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  function drawRotatingStar() {
    let x = centerX + Math.cos(rotAngle)*orbitRadius;
    let y = centerY + Math.sin(rotAngle)*orbitRadius;
    let size = 18;
    if (hitFlash > 0) size += 6, hitFlash -= 0.03;
    if (perfectFlash > 0) size += 8, perfectFlash -= 0.02;
    if (missFlash > 0) size -= 4, missFlash -= 0.03;
    if (starGlowActive || starGlowTimer>0) {
      ctx.shadowBlur = 28;
      ctx.shadowColor = '#ffbc6e';
    }
    let grad = ctx.createRadialGradient(x-5,y-5,4,x,y,size);
    grad.addColorStop(0,'#ffe0aa');
    grad.addColorStop(1,'#c87a4a');
    ctx.beginPath();
    ctx.arc(x,y,size,0,2*Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x,y,size*0.45,0,2*Math.PI);
    ctx.fillStyle = '#fff2cf';
    ctx.fill();
    ctx.shadowBlur = 0;
    if (starGlowActive) {
      ctx.beginPath();
      ctx.arc(x,y,size+5,0,2*Math.PI);
      ctx.strokeStyle = '#ffd58c';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }
  
  function drawComboMeter() {
    if (combo >= 5) {
      ctx.font = "bold 38px 'Segoe UI','Quicksand'";
      ctx.fillStyle = '#ffe3b0';
      ctx.shadowBlur = 6;
      ctx.fillText(`${combo}`, centerX-38, centerY-65);
      ctx.font = "12px monospace";
      ctx.fillStyle = '#dbb87a';
      ctx.fillText("连 契", centerX-22, centerY-42);
      ctx.shadowBlur = 0;
    }
    if (multiplierFlash > 0) {
      ctx.font = "bold 20px 'Segoe UI'";
      ctx.fillStyle = '#ffbf7a';
      ctx.fillText(`${flowMultiplier.toFixed(1)}x`, centerX+30, centerY-70);
      multiplierFlash -= 0.02;
    }
  }
  
  function drawParticles() {
    for(let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,2*Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  
  function drawHitIndicator() {
    let angleDiff = getAngleDifference(rotAngle, fixedAngle);
    if (gameActive && angleDiff < GOOD_RAD && canHitThisCycle) {
      ctx.beginPath();
      ctx.arc(centerX, centerY, orbitRadius+12, 0, 2*Math.PI);
      ctx.strokeStyle = '#ffc28c';
      ctx.lineWidth = 3;
      ctx.setLineDash([6,12]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  
  function render() {
    if (!ctx) return;
    drawBackground();
    drawOrbit();
    drawFixedStar();
    drawRotatingStar();
    drawComboMeter();
    drawParticles();
    drawHitIndicator();
  }
  
  // 动画循环
  let lastFrameTime = 0;
  function animate(nowMs) {
    if (!gameActive) {
      render();
      animFrame = requestAnimationFrame(animate);
      return;
    }
    let delta = Math.min(0.033, (nowMs - lastFrameTime) / 1000);
    if (delta > 0) {
      updateRotation(delta);
      updateParticles(delta);
    }
    lastFrameTime = nowMs;
    render();
    animFrame = requestAnimationFrame(animate);
  }
  
  // 启动/停止游戏
  function startGame() {
    if (gameActive) {
      gameActive = false;
      if (animFrame) cancelAnimationFrame(animFrame);
      startBtn.innerText = "🌠 启舞 · 星尘旋涡 🌠";
      setFeedbackMessage("🌌 星轨静默，随时再启 🌌", true);
      render();
      return;
    }
    fullReset();
    gameActive = true;
    canHitThisCycle = true;
    starGlowActive = false;
    flowMultiplier = 1.0;
    updateAngularSpeed();
    // 激活音频
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => { soundEnabled = true; });
    } else { soundEnabled = true; }
    lastFrameTime = performance.now();
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(animate);
    startBtn.innerText = "⏸ 星尘暂歇 · 收束流光 ⏸";
    setFeedbackMessage("🎶 星尘华尔兹 · 随星轨而击 🎶", true);
  }
  
  // 画布自适应
  function resizeCanvasInternal() {
    let rect = canvas.getBoundingClientRect();
    canvas.width = 600;
    canvas.height = 600;
    centerX = 300;
    centerY = 300;
    orbitRadius = Math.min(260, canvas.width * 0.44);
    render();
  }
  
  // 事件绑定
  function bindEvents() {
    canvas.addEventListener('click', (e) => { e.preventDefault(); handlePlayerAction(); });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); handlePlayerAction(); }
    });
    startBtn.addEventListener('click', startGame);
    bpmSlider.addEventListener('input', () => {
      if (gameActive) updateAngularSpeed();
      bpmDisplay.innerText = bpmSlider.value;
    });
    window.addEventListener('resize', resizeCanvasInternal);
  }
  
  function init() {
    resizeCanvasInternal();
    bindEvents();
    gameActive = false;
    fullReset();
    render();
  }
  init();
})();
</script>
